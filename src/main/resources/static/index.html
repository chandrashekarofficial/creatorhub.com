<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorHub</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div id="app">

    <!-- LOGIN -->
    <section id="loginPage" class="auth-page">
        <div class="auth-card">
            <h1>CreatorHub</h1>
            <p class="text-muted">Manage your content. Track your growth.</p>

            <form id="loginForm">
                <div class="mb-3">
                    <label>Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        class="form-control"
                        value="testcreator@example.com"
                        required>
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        value="TestPassword123!"
                        required>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Login
                </button>

                <div id="loginError" class="text-danger mt-3"></div>
            </form>
        </div>
    </section>


    <!-- DASHBOARD APP -->
    <section id="dashboardApp" class="d-none">

        <nav class="navbar navbar-dark bg-dark px-4">
            <span class="navbar-brand fw-bold">CreatorHub</span>

            <button id="logoutBtn" class="btn btn-outline-light btn-sm">
                Logout
            </button>
        </nav>

        <div class="container-fluid">

            <div class="row">

                <!-- SIDEBAR -->
                <aside class="col-md-2 sidebar">

                    <button class="nav-btn active" data-page="dashboard">
                        Dashboard
                    </button>

                    <button class="nav-btn" data-page="videos">
                        Videos
                    </button>

                    <button class="nav-btn" data-page="content">
                        Content Ideas
                    </button>

                    <button class="nav-btn" data-page="calendar">
                        Calendar
                    </button>

                    <button class="nav-btn" data-page="seo">
                        SEO
                    </button>

                    <button class="nav-btn" data-page="reports">
                        Reports
                    </button>

                </aside>


                <!-- MAIN -->
                <main class="col-md-10 main-content">

                    <!-- DASHBOARD PAGE -->
                    <div id="page-dashboard" class="page">

                        <h2>Dashboard</h2>
                        <p class="text-muted">
                            Your content performance overview
                        </p>

                        <div id="dashboardCards"
                             class="row g-3">
                        </div>

                    </div>


                    <!-- VIDEOS PAGE -->
                    <div id="page-videos" class="page d-none">

                        <h2>Videos</h2>

                        <div id="videosContainer"
                             class="mt-4">
                        </div>

                    </div>


                    <!-- CONTENT PAGE -->
                    <div id="page-content" class="page d-none">

                        <h2>Content Ideas</h2>

                        <div id="contentContainer"
                             class="mt-4">
                        </div>

                    </div>


                    <!-- CALENDAR PAGE -->
                    <div id="page-calendar" class="page d-none">

                        <h2>Calendar</h2>

                        <div id="calendarContainer"
                             class="mt-4">
                        </div>

                    </div>


                    <!-- SEO PAGE -->
                    <div id="page-seo" class="page d-none">

                        <h2>SEO</h2>

                        <div id="seoContainer"
                             class="mt-4">
                        </div>

                    </div>


                    <!-- REPORTS PAGE -->
                    <div id="page-reports" class="page d-none">

                        <h2>Reports</h2>

                        <div id="reportsContainer"
                             class="mt-4">
                        </div>

                    </div>

                </main>

            </div>

        </div>

    </section>

</div>


<script src="/js/app.js"></script>

</body>
</html>
